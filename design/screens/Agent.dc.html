<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Agentul, de la repaus la răspuns</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;400;600&amp;display=swap">
<style>
body{margin:0;background:#0f1214}
a{color:#9cc7d4}a:hover{color:#f1efe9}
.stage{position:relative;width:1280px;height:800px;overflow:hidden;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#f1efe9;font-variant-numeric:tabular-nums}
.bg{position:absolute;inset:0;transition:filter .5s ease,opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.stage:not(.ph-idle) .bg{filter:blur(10px);opacity:.32;transform:scale(.985)}
.cloud{position:absolute;border-radius:50%;filter:blur(38px);animation:drift 80s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-70px,0,0)}to{transform:translate3d(90px,-12px,0)}}
.orbwrap{position:absolute;left:640px;top:540px;width:0;height:0;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.ph-idle .orbwrap{transform:translate(476px,171px) scale(.42)}
.orbsvg{position:absolute;left:-130px;top:-130px;overflow:visible}
.breath{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
.stage:not(.ph-idle) .breath{animation:none}
.kindle{transform-box:fill-box;transform-origin:center}
.ph-wake .kindle{animation:kindle .6s cubic-bezier(.2,.8,.2,1)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes kindle{0%{transform:scale(1)}35%{transform:scale(.82)}75%{transform:scale(1.14)}100%{transform:scale(1)}}
.glow{transition:opacity .5s ease}
.ph-idle .glow{opacity:.55}
.ignite{opacity:0;transform-box:fill-box;transform-origin:center}
.ph-wake .ignite{animation:ignite .7s ease-out forwards}
@keyframes ignite{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.9)}}
.rings-in,.rings-out{opacity:0;transition:opacity .35s ease}
.ph-listen .rings-in{opacity:1}
.ph-speak .rings-out{opacity:1}
.rings-in circle,.rings-out circle,.core{transition:r .12s linear}
.arc{opacity:0;transform-box:view-box;transform-origin:130px 130px;transition:opacity .3s ease}
.ph-think .arc,.ph-act .arc{opacity:1;animation:spin 1.1s linear infinite}
.ph-act .arc{animation-duration:.7s}
@keyframes spin{to{transform:rotate(360deg)}}
.swirl{transform-box:fill-box;transform-origin:center}
.ph-think .swirl,.ph-act .swirl{animation:spin 2.4s linear infinite}
.follow{opacity:0}
.ph-follow .follow{opacity:1;animation:follow 3s linear forwards}
@keyframes follow{from{stroke-dashoffset:0}to{stroke-dashoffset:326.7}}
.talk{position:absolute;left:140px;top:150px;width:1000px;text-align:center;opacity:0;transform:translateY(14px);transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.ph-listen .talk,.ph-think .talk,.ph-act .talk,.ph-speak .talk,.ph-follow .talk{opacity:1;transform:none}
.heard{transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.ph-think .heard,.ph-act .heard{opacity:.55;transform:translateY(-6px)}
.wd{color:#f1efe9;transition:color .25s ease}
.wd.soft{color:#9aa3a6}
.wd.dim{color:rgba(241,239,233,0.30)}
.wd.lit{color:#f1efe9}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.rise.r2{animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.caption{position:absolute;left:340px;top:678px;width:600px;text-align:center;font-size:17px;line-height:24px;color:#9aa3a6;transition:opacity .3s ease}
.ph-idle .caption{opacity:0}
.proto{position:absolute;top:16px;left:16px;right:16px;z-index:5;display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 14px;border:1px solid rgba(241,239,233,0.16);border-radius:999px;background:rgba(15,18,20,0.6);color:#c9ced0;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:#9cc7d4;color:#0f1214;border-color:#9cc7d4}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition-duration:.01s !important}}
</style>
</helmet>
<div class="{{ stageClass }}" style="background: linear-gradient(180deg, #172028 0%, #11161a 55%, #0f1214 100%)">

  <div class="bg">
    <div style="position: absolute; inset: 0; background: radial-gradient(900px 520px at 78% 112%, rgba(214,150,104,0.20), rgba(214,150,104,0) 70%), radial-gradient(1200px 700px at 20% -10%, rgba(120,150,175,0.22), rgba(120,150,175,0) 65%)"></div>
    <div class="cloud" style="left: 120px; top: 60px; width: 520px; height: 160px; background: rgba(190,205,220,0.07)"></div>
    <div class="cloud" style="left: 640px; top: 160px; width: 420px; height: 130px; background: rgba(190,205,220,0.05); animation-duration: 110s"></div>
    <div style="position: absolute; left: 80px; bottom: 80px; display: flex; flex-direction: column">
      <div style="font-size: 22px; line-height: 28px; font-weight: 600; color: #9aa3a6">{{ date }}</div>
      <div style="font-size: 260px; line-height: 240px; font-weight: 200; letter-spacing: -0.04em">{{ time }}</div>
      <div style="font-size: 30px; line-height: 38px; margin-top: 24px">Sala la 18:30 · ia umbrela, plouă de la 19:00</div>
    </div>
  </div>

  <div class="talk">
    <sc-if value="{{ showHeard }}" hint-placeholder-val="{{ true }}">
      <div class="heard" style="font-size: 40px; line-height: 50px; font-weight: 400; letter-spacing: -0.01em; text-wrap: balance">
        <sc-for list="{{ heardWords }}" as="w" hint-placeholder-count="6"><span class="{{ w.cls }}">{{ w.t }} </span></sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ showReply }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 28px; margin-top: 28px">
        <div style="font-size: 30px; line-height: 40px; font-weight: 600; max-width: 900px; text-wrap: balance">
          <sc-for list="{{ replyWords }}" as="w" hint-placeholder-count="8"><span class="{{ w.cls }}">{{ w.t }} </span></sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ showActions }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; justify-content: center; gap: 12px; margin-top: 28px">
        <div class="rise" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px 0 8px; border-radius: 999px; background: rgba(241,239,233,0.08)">
          <span style="width: 32px; height: 32px; border-radius: 999px; background: #9ccaa2; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="#0f1214" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
          <span style="font-size: 17px; line-height: 24px; font-weight: 600">Lumini sufragerie · stinse</span>
        </div>
        <div class="rise r2" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px 0 8px; border-radius: 999px; background: rgba(241,239,233,0.08)">
          <span style="width: 32px; height: 32px; border-radius: 999px; background: #9ccaa2; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="#0f1214" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
          <span style="font-size: 17px; line-height: 24px; font-weight: 600">HomePod · Seară</span>
        </div>
      </div>
    </sc-if>
  </div>

  <div class="orbwrap" aria-hidden="true">
    <svg class="orbsvg" width="260" height="260" viewBox="0 0 260 260">
      <defs>
        <radialGradient id="emberCore" cx="40%" cy="36%" r="66%">
          <stop offset="0%" stop-color="#ffe9cf"></stop>
          <stop offset="45%" stop-color="#f0a35e"></stop>
          <stop offset="100%" stop-color="#b8612a"></stop>
        </radialGradient>
        <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(240,163,94,0.55)"></stop>
          <stop offset="100%" stop-color="rgba(240,163,94,0)"></stop>
        </radialGradient>
      </defs>
      <circle class="glow" cx="130" cy="130" r="120" fill="url(#emberGlow)"></circle>
      <g class="rings-in">
        <circle cx="130" cy="130" r="{{ ringA }}" fill="none" stroke="rgba(156,199,212,0.55)" stroke-width="2"></circle>
        <circle cx="130" cy="130" r="{{ ringB }}" fill="none" stroke="rgba(156,199,212,0.25)" stroke-width="2"></circle>
      </g>
      <g class="rings-out">
        <circle cx="130" cy="130" r="{{ ringA }}" fill="none" stroke="rgba(240,163,94,0.60)" stroke-width="2"></circle>
        <circle cx="130" cy="130" r="{{ ringB }}" fill="none" stroke="rgba(240,163,94,0.28)" stroke-width="2"></circle>
      </g>
      <circle class="ignite" cx="130" cy="130" r="52" fill="none" stroke="rgba(240,163,94,0.8)" stroke-width="3"></circle>
      <circle class="arc" cx="130" cy="130" r="56" fill="none" stroke="#f0a35e" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 282"></circle>
      <circle class="follow" cx="130" cy="130" r="52" fill="none" stroke="rgba(241,239,233,0.55)" stroke-width="2" stroke-dasharray="326.7" transform="rotate(-90 130 130)"></circle>
      <g class="kindle"><g class="breath"><g class="swirl">
        <circle class="core" cx="130" cy="130" r="{{ coreR }}" fill="url(#emberCore)"></circle>
        <circle cx="118" cy="118" r="9" fill="rgba(255,240,220,0.55)"></circle>
      </g></g></g>
    </svg>
  </div>

  <div class="caption">{{ caption }}</div>

  <div class="proto">
    <button type="button" class="{{ runClass }}" onClick="{{ run }}">▶ Rulează scenariul</button>
    <sc-for list="{{ phases }}" as="p" hint-placeholder-count="6">
      <button type="button" class="{{ p.cls }}" onClick="{{ p.pick }}">{{ p.label }}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timers = [];
    this.heardText = 'Stinge luminile din sufragerie și pune ceva liniștit pe HomePod'.split(' ');
    this.replyText = 'Am stins luminile din sufragerie și am pornit playlistul Seară pe HomePod.'.split(' ');
    this.setState({ phase: 'idle', heard: 0, spoken: 0, amp: 0, running: false, now: new Date() });
    this.clock = setInterval(() => this.setState({ now: new Date() }), 10000);
    this.ampTimer = setInterval(() => {
      const s = this.state || {};
      const t = Date.now() / 1000;
      let target = 0;
      if (s.phase === 'listen' && (s.heard || 0) < this.heardText.length) target = 0.3 + 0.7 * Math.random();
      if (s.phase === 'speak' && (s.spoken || 0) < this.replyText.length) target = 0.25 + 0.6 * Math.abs(Math.sin(t * 9)) * (0.6 + 0.4 * Math.random());
      const amp = (s.amp || 0) + (target - (s.amp || 0)) * 0.4;
      if (Math.abs(amp - (s.amp || 0)) > 0.005) this.setState({ amp: amp });
    }, 90);
    this.at(900, () => this.run());
  }
  componentWillUnmount() {
    this.clearAll();
    clearInterval(this.clock);
    clearInterval(this.ampTimer);
  }
  at(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
  clearAll() { (this.timers || []).forEach(clearTimeout); this.timers = []; }
  run() {
    this.clearAll();
    const H = this.heardText.length, R = this.replyText.length;
    this.setState({ phase: 'idle', heard: 0, spoken: 0, running: true });
    this.at(1600, () => this.setState({ phase: 'wake' }));
    this.at(2200, () => this.setState({ phase: 'listen' }));
    for (let i = 1; i <= H; i++) this.at(2200 + i * 380, () => this.setState({ heard: i }));
    const tThink = 2200 + H * 380 + 700;
    this.at(tThink, () => this.setState({ phase: 'think' }));
    this.at(tThink + 1500, () => this.setState({ phase: 'act' }));
    const tSpeak = tThink + 2700;
    this.at(tSpeak, () => this.setState({ phase: 'speak', spoken: 0 }));
    for (let i = 1; i <= R; i++) this.at(tSpeak + i * 290, () => this.setState({ spoken: i }));
    const tFollow = tSpeak + R * 290 + 500;
    this.at(tFollow, () => this.setState({ phase: 'follow' }));
    this.at(tFollow + 3000, () => this.setState({ phase: 'idle', running: false }));
    this.at(tFollow + 3700, () => this.setState({ heard: 0, spoken: 0 }));
  }
  pick(phase) {
    this.clearAll();
    const H = this.heardText.length, R = this.replyText.length;
    const heard = phase === 'idle' || phase === 'wake' ? 0 : phase === 'listen' ? 6 : H;
    const spoken = phase === 'speak' ? 6 : phase === 'follow' ? R : 0;
    this.setState({ phase: phase, heard: heard, spoken: spoken, running: false });
    if (phase === 'listen' || phase === 'speak') {
      for (let i = 1; i <= 3; i++) this.at(i * 380, () => this.setState(phase === 'listen' ? { heard: Math.min(H, heard + i) } : { spoken: Math.min(R, spoken + i) }));
    }
  }
  renderVals() {
    const s = this.state || {};
    const phase = s.phase || 'idle';
    const amp = s.amp || 0;
    const heard = s.heard || 0;
    const spoken = s.spoken || 0;
    const H = (this.heardText || []).length;
    const now = s.now || new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const days = ['Duminică', 'Luni', 'Marți', 'Miercuri', 'Joi', 'Vineri', 'Sâmbătă'];
    const months = ['ianuarie', 'februarie', 'martie', 'aprilie', 'mai', 'iunie', 'iulie', 'august', 'septembrie', 'octombrie', 'noiembrie', 'decembrie'];
    const listening = phase === 'listen';
    const heardWords = (this.heardText || []).slice(0, heard).map((t, i) => ({ t: t, cls: 'wd' + (listening && i === heard - 1 && heard < H ? ' soft' : '') }));
    const replyWords = (this.replyText || []).map((t, i) => ({ t: t, cls: 'wd ' + (phase === 'follow' || i < spoken ? 'lit' : 'dim') }));
    const captions = {
      idle: '',
      wake: 'Te ascult',
      listen: 'Ascult…',
      think: 'Mă gândesc · model local, pe hub',
      act: 'Sting luminile · pornesc muzica',
      speak: '',
      follow: 'Poți continua fără să spui „Aether”',
    };
    const labels = [['idle', 'Repaus'], ['wake', 'Declanșat'], ['listen', 'Ascultă'], ['think', 'Procesează'], ['act', 'Acționează'], ['speak', 'Vorbește'], ['follow', 'Revine']];
    return {
      stageClass: 'stage ph-' + phase,
      date: days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()],
      time: pad(now.getHours()) + ':' + pad(now.getMinutes()),
      coreR: (34 + amp * 9).toFixed(1),
      ringA: (50 + amp * 26).toFixed(1),
      ringB: (66 + amp * 46).toFixed(1),
      showHeard: heard > 0 && phase !== 'speak' && phase !== 'follow',
      showReply: phase === 'speak' || phase === 'follow',
      showActions: phase === 'act' || phase === 'speak' || phase === 'follow',
      heardWords: heardWords,
      replyWords: replyWords,
      caption: captions[phase] || '',
      runClass: 'chip' + (s.running ? ' on' : ''),
      run: () => this.run(),
      phases: labels.map(([id, label]) => ({ label: label, cls: 'chip' + (!s.running && phase === id ? ' on' : ''), pick: () => this.pick(id) })),
    };
  }
}
</script>
</body>
</html>
