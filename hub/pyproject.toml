[project]
name = "aether-hub"
version = "0.1.0"
description = "AetherOS hub: agent, model router and plugins; screens connect over WebSocket."
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43,<47",
  "pydantic>=2.8,<3",
  "websockets>=13,<16",
]

[project.scripts]
aether-hub = "aether_hub.server:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["UP007"]
