name: aether_design
description: AetherOS design tokens and theme for Flutter. Tokens are generated from design/tokens.json.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Hanken Grotesk, SIL Open Font License (fonts/OFL.txt). Static instances of the
  # variable font from github.com/google/fonts, one file per weight the tokens use.
  fonts:
    - family: Hanken Grotesk
      fonts:
        - asset: fonts/HankenGrotesk-ExtraLight.ttf
          weight: 200
        - asset: fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
